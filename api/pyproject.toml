[project]
name = "personal-tracker-api"
version = "0.2.6"
description = "Backend for Personal Tracker, a local single-user fitness and task tracker"
# 3.12 is what the release workflow builds the shipped binary against; local dev
# runs newer. Keep this floor and ruff's target-version in step with CI so we
# never emit syntax the release build cannot parse.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]==0.40.0",
    "aiosqlite",
    "pydantic",
    "pydantic-settings",
    "starlette",
    "python-dateutil",
    "python-multipart",
    "fitdecode>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio",
    "httpx",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil>=2.9.0.20260807",
]
# Only needed to produce the standalone binary in CI.
build = [
    "pyinstaller",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a function call in a default argument,
# which B008 flags by design. These are evaluated per-request by FastAPI, not
# once at import, so the mutable-default hazard B008 guards against
# does not apply.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true

# fitdecode ships no type stubs.
[[tool.mypy.overrides]]
module = "fitdecode.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
